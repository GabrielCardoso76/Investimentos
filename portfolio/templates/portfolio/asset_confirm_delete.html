{% extends 'portfolio/base.html' %}

{% block title %}Confirmar Exclusão{% endblock %}

{% block content %}
<h2>Confirmar Exclusão</h2>
<hr>
<p>Você tem certeza que deseja excluir o ativo <strong>{{ asset.ticker }}</strong>?</p>
<p>Esta ação não pode ser desfeita.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, Excluir</button>
    <a href="{% url 'portfolio:asset_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
